# =============================================================================
# DST HyperCore Server Native Engine v1.0.0 Configuration
# Place alongside iphlpapi.dll inside:
#   <Don't Starve Together>/bin64/
#
# Pure pass-through in client (dontstarve_steam_x64.exe) and CrashReporter.exe.
# Activates ONLY in dontstarve_dedicated_server_nullrenderer_x64.exe.
# =============================================================================

# [Module 0] Built-in microsecond QPC telemetry & dst_hypercore.log summaries
enable_profiler = 1
log_interval_ticks = 300

# [Module 1] Hermetic lua_newstate -> lockless mimalloc (eliminates Ring-0 WaitForSingleObject on Lua allocs)
enable_mimalloc = 1

# [Module 2] Zero-copy read-only SpatialGrid::Query for EntityManager::FindEntities
enable_spatial_zerocopy = 1

# [Module 3] 30Hz adaptive slack-based incremental GC (eliminates STW full-GC combat freezes)
enable_adaptive_gc = 1
gc_spare_target_ms = 28.0
gc_calm_max_ms = 4.0
gc_busy_min_ms = 0.4
gc_emergency_add_mb = 256

# [Module 4] SIMD libdeflate (AVX2/SSE2) for RFC1950 compress2 + C++ FastDataDumper
enable_libdeflate = 1
libdeflate_level = 5
enable_fast_dumper = 1

# OS 1ms timer resolution + HIGH_PRIORITY_CLASS for steady 30Hz tick pacing
enable_timer_boost = 1

# [Optional] Zero-dependency read-only JSON metrics endpoint (http://127.0.0.1:7869/metrics)
# Disabled by default (0 extra threads when off).
enable_http_metrics = 0
http_port = 7869
