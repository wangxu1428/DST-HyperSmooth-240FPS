# =============================================================================
# DST HyperCore Server Native Engine v1.5.0 Configuration
# Place alongside iphlpapi.dll inside:
#   <Don't Starve Together>/bin64/
#
# Pure pass-through in client (dontstarve_steam_x64.exe) and CrashReporter.exe.
# Activates ONLY in dontstarve_dedicated_server_nullrenderer_x64.exe.
# =============================================================================

# [Hardware Tier] Hardware liberation preset (runtime-overridable via Mod setting or c_hypertier):
#   low       (0): Conservative memory/GC headroom for low-spec hosts
#   balanced  (1): Default balanced VPS/server preset
#   unleashed (2): Full modern hardware liberation (high RAM GC/cache ceilings, L2 fast deflate)
hardware_tier = balanced

# [Module 0] Built-in microsecond QPC telemetry & dst_hypercore.log summaries
enable_profiler = 1
log_interval_ticks = 300

# [Module 1] Hermetic lua_newstate -> lockless mimalloc (eliminates Ring-0 WaitForSingleObject on Lua allocs)
enable_mimalloc = 1

# [Module 2] Zero-copy read-only SpatialGrid::Query for FindEntities / FindEntities_Registered / LightWatcher (5+1 sites)
enable_spatial_zerocopy = 1

# [Module 3] 30Hz adaptive slack-based incremental GC + Anti-STW Full-GC shield
enable_adaptive_gc = 1
enable_anti_stw_gc = 1
gc_spare_target_ms = 28.0
gc_calm_max_ms = 4.0
gc_busy_min_ms = 0.4
gc_emergency_add_mb = 256

# [Module 4] SIMD libdeflate (AVX2/SSE2) for RFC1950 compress2, FastLoad zip/zlib/vector acceleration + C++ FastDataDumper
enable_libdeflate = 1
libdeflate_level = 5
enable_fast_load = 1
enable_fast_dumper = 1

# OS 1ms timer resolution + HIGH_PRIORITY_CLASS for steady 30Hz tick pacing
enable_timer_boost = 1

# [Optional] Zero-dependency read-only JSON metrics endpoint (http://127.0.0.1:7869/metrics)
# Disabled by default (0 extra threads when off).
enable_http_metrics = 0
http_port = 7869

# [Telemetry] Low-overhead in-memory Spike Black Box (0 = auto 33.3ms@30Hz / 16.7ms@60Hz)
enable_blackbox = 1
blackbox_threshold_ms = 0

# [Experimental Opt-In] True 60Hz Server Simulation Tick Rate (30 = stock vanilla default, 60 = high-tick mode)
# When set to 60, iphlpapi.dll auto-syncs NetworkTickRate -> U=60(1) (respecting explicit cluster.ini overrides),
# paces the server outer loop at 120Hz (2x Nyquist), and HyperSmooth v2.4.0+ clients auto-negotiate 60Hz SimTick!
sim_tick_rate = 30

# [Module 5] RakNet Event-Driven Zero-Stall Wakeup (eliminates 0-10ms UDP WaitOnEvent stall, 0% idle CPU)
enable_raknet_instant_wake = 1

# [Module 6] O(N log N) Flat-Hash + Binary-Heap Pathfinder A* Engine (v1.3.0: eliminates quadratic walled-base A* spikes)
enable_fast_astar = 1

# [Module 7] Read-Only Mod/Data Negative Stat Cache (0-syscall cache for multi-mod asset probing misses)
enable_fs_neg_cache = 1

# [Module 8] Verified Atomic Save-Commit (per-path lock, unique .hc_tmp, verified fsync+close + atomic rename; fail-closed on disk errors)
enable_async_save = 1

# [Module 9] Causal 3-Channel RakNet::RPC4 QoS Classifier (promotes combat/movement RPCs, isolates social/broadcast traffic)
enable_rpc_qos = 1

# [Module 10] O(N) ReplicaManager3::QueryReplicaList Fast-Path + PreSerialize Zero-Scan
enable_replica_fastpath = 1

